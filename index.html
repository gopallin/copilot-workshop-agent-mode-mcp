<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f6f4">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-card">
    <header class="card-header">
      <p class="eyebrow">把想做的事，一件件完成</p>
      <div class="header-row">
        <h1>待辦清單</h1>
        <button class="theme-toggle" id="theme-toggle" type="button">
          <span id="theme-icon" aria-hidden="true">🌙</span>
          <span id="theme-label">深色模式</span>
        </button>
      </div>
    </header>

    <form class="add-form" id="todo-form">
      <label class="visually-hidden" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        name="todo"
        type="text"
        placeholder="接下來要做什麼？"
        autocomplete="off"
        maxlength="200"
        required
      >
      <button class="add-button" type="submit" aria-label="新增待辦事項">
        <span aria-hidden="true">+</span>
        <span>新增</span>
      </button>
    </form>

    <div class="filter-bar" role="group" aria-label="篩選待辦事項">
      <button class="filter-button is-selected" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <ul class="todo-list" id="todo-list" aria-label="待辦事項"></ul>
    <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="card-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
    </footer>
  </main>
</body>
</html>
